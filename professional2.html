<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Professional Template 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-file-pdf"></i> CV Builder
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="templates.html">Templates</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Action Buttons -->
    <div class="container mt-4 mb-4">
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-primary" onclick="editCV()">
                <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn btn-success" onclick="printCV()">
                <i class="fas fa-print"></i> Print
            </button>
            <button class="btn btn-info" onclick="downloadPDF()">
                <i class="fas fa-download"></i> Download PDF
            </button>
            <a href="templates.html" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <!-- CV Container -->
    <div class="container mb-5">
        <div class="row">
            <div class="col-lg-8">
                <!-- Header -->
                <div class="mb-4">
                    <h1 id="nameDisplay" class="mb-1">Your Name</h1>
                    <p id="careerSummaryDisplay" class="text-muted mb-3">Professional Summary</p>
                    <div class="row g-3">
                        <div class="col-auto">
                            <small id="emailDisplay"><i class="fas fa-envelope me-2"></i>email@example.com</small>
                        </div>
                        <div class="col-auto">
                            <small id="phoneDisplay"><i class="fas fa-phone me-2"></i>+1 (555) 123-4567</small>
                        </div>
                        <div class="col-auto">
                            <small id="addressDisplay"><i class="fas fa-map-marker-alt me-2"></i>City, Country</small>
                        </div>
                    </div>
                </div>

                <!-- Work Experience -->
                <div class="mb-4">
                    <h5 class="fw-bold text-secondary mb-3">WORK EXPERIENCE</h5>
                    <div id="experienceDisplayProfessional2"></div>
                </div>

                <!-- Education -->
                <div class="mb-4">
                    <h5 class="fw-bold text-secondary mb-3">EDUCATION</h5>
                    <div id="educationDisplayProfessional2"></div>
                </div>

                <!-- Projects -->
                <div class="mb-4">
                    <h5 class="fw-bold text-secondary mb-3">PROJECTS</h5>
                    <div id="projectsDisplayProfessional2"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <!-- Sidebar -->
                <div class="mb-4">
                    <div id="profilePhotoContainer" class="text-center mb-4">
                        <img id="profilePhotoDisplay" src="https://via.placeholder.com/150" alt="Profile" class="rounded" style="width: 150px; height: 150px; object-fit: cover; border: 2px solid #ccc;">
                    </div>
                </div>

                <!-- Skills -->
                <div class="mb-4">
                    <h5 class="fw-bold text-secondary mb-3">SKILLS</h5>
                    <div id="skillsDisplayProfessional2"></div>
                </div>

                <!-- Certifications -->
                <div class="mb-4">
                    <h5 class="fw-bold text-secondary mb-3">CERTIFICATIONS</h5>
                    <div id="certificationsDisplayProfessional2"></div>
                </div>

                <!-- Links -->
                <div class="mb-4">
                    <h5 class="fw-bold text-secondary mb-3">LINKS</h5>
                    <p id="linkedinDisplay" class="mb-2">
                        <i class="fas fa-linkedin me-2"></i><a href="#">LinkedIn</a>
                    </p>
                    <p id="portfolioDisplay" class="mb-0">
                        <i class="fas fa-globe me-2"></i><a href="#">Portfolio</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 CV Builder. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            displayCVData('professional2');
        });
    </script>
</body>
</html>
