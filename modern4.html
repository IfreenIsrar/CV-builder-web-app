<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Modern Template 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-file-pdf"></i> CV Builder
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="templates.html">Templates</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Action Buttons -->
    <div class="container mt-4 mb-4">
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-primary" onclick="editCV()">
                <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn btn-success" onclick="printCV()">
                <i class="fas fa-print"></i> Print
            </button>
            <button class="btn btn-info" onclick="downloadPDF()">
                <i class="fas fa-download"></i> Download PDF
            </button>
            <a href="templates.html" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <!-- CV Container -->
    <div class="container mb-5">
        <!-- Profile Section -->
        <div class="card border-0 shadow-sm mb-4 bg-gradient-modern-4 text-white">
            <div class="card-body p-5 text-center">
                <div id="profilePhotoContainer" class="mb-4">
                    <img id="profilePhotoDisplay" src="https://via.placeholder.com/140" alt="Profile" class="rounded-circle" style="width: 140px; height: 140px; object-fit: cover; border: 5px solid white;">
                </div>
                <h1 id="nameDisplay" class="mb-3">Your Name</h1>
                <p id="careerSummaryDisplay" class="lead mb-4">Professional Summary</p>
                <div class="row g-3 justify-content-center">
                    <div class="col-auto">
                        <i class="fas fa-envelope me-2"></i><span id="emailDisplay">email@example.com</span>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-phone me-2"></i><span id="phoneDisplay">+1 (555) 123-4567</span>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-map-marker-alt me-2"></i><span id="addressDisplay">City, Country</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-6">
                <!-- Work Experience -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-briefcase me-2"></i>Work Experience</h5>
                    </div>
                    <div class="card-body" id="experienceDisplayModern4"></div>
                </div>

                <!-- Education -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-graduation-cap me-2"></i>Education</h5>
                    </div>
                    <div class="card-body" id="educationDisplayModern4"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <!-- Skills -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="fas fa-star me-2"></i>Skills</h5>
                    </div>
                    <div class="card-body" id="skillsDisplayModern4"></div>
                </div>

                <!-- Certifications -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-certificate me-2"></i>Certifications</h5>
                    </div>
                    <div class="card-body" id="certificationsDisplayModern4"></div>
                </div>
            </div>
        </div>

        <!-- Projects -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="fas fa-project-diagram me-2"></i>Projects</h5>
            </div>
            <div class="card-body" id="projectsDisplayModern4"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 CV Builder. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            displayCVData('modern4');
        });
    </script>
</body>
</html>
